name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck install.sh
        run: shellcheck install.sh

      - name: Kiểm tra cú pháp Python
        run: python3 -m py_compile term-autocopy

      - name: Kiểm tra GNOME Shell extension
        run: |
          dir="gnome-extension/term-autocopy@tandat2909.github.io"
          python3 -c "import json; m = json.load(open('$dir/metadata.json')); assert m['uuid'] == 'term-autocopy@tandat2909.github.io'; print(m['shell-version'])"
          cp "$dir/extension.js" /tmp/extension.mjs
          node --check /tmp/extension.mjs

      - name: Thử cài và gỡ extension (giả lập Ubuntu Wayland)
        run: |
          export HOME="$(mktemp -d)"
          export XDG_CONFIG_HOME="$HOME/.config" XDG_DATA_HOME="$HOME/.local/share"
          mkdir -p "$HOME/fakebin"
          printf '#!/bin/sh\necho "GNOME Shell 50.1"\n' > "$HOME/fakebin/gnome-shell"
          chmod +x "$HOME/fakebin/gnome-shell"
          export PATH="$HOME/fakebin:$PATH"
          ext="$XDG_DATA_HOME/gnome-shell/extensions/term-autocopy@tandat2909.github.io"
          XDG_SESSION_TYPE=wayland XDG_CURRENT_DESKTOP=ubuntu:GNOME sh install.sh
          test -f "$ext/extension.js"
          test ! -e "$HOME/.local/bin/term-autocopy"
          XDG_SESSION_TYPE=wayland XDG_CURRENT_DESKTOP=ubuntu:GNOME sh install.sh --uninstall
          test ! -e "$ext"
          # GNOME quá cũ phải báo lỗi rõ ràng
          printf '#!/bin/sh\necho "GNOME Shell 42.9"\n' > "$HOME/fakebin/gnome-shell"
          if XDG_SESSION_TYPE=wayland XDG_CURRENT_DESKTOP=ubuntu:GNOME sh install.sh; then exit 1; fi

      - name: Thử cài và gỡ trong HOME tạm
        run: |
          # lỗi thì đưa log vào annotation để xem được ngay trên trang Actions
          fail() {
            echo "::error title=$1::$(tail -n 40 install.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
            exit 1
          }
          export HOME="$(mktemp -d)"
          export XDG_CONFIG_HOME="$HOME/.config"   # runner đặt sẵn biến này trỏ về /home/runner
          DISPLAY= sh -x install.sh > install.log 2>&1 || fail "install.sh lỗi"
          "$HOME/.local/bin/term-autocopy" --version >> install.log 2>&1 || fail "term-autocopy --version lỗi"
          test -f "$HOME/.config/autostart/term-autocopy.desktop" || fail "thiếu file autostart"
          sh install.sh --uninstall >> install.log 2>&1 || fail "gỡ cài đặt lỗi"
          test ! -e "$HOME/.local/bin/term-autocopy" || fail "gỡ chưa xoá file chạy"
          test ! -e "$HOME/.config/autostart/term-autocopy.desktop" || fail "gỡ chưa xoá autostart"
          cat install.log
